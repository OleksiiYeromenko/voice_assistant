# Voice Assistant Configuration
# Copy to config.yaml and edit for your setup

# --- Wake Word ---
wake_word:
  # Pre-trained models: "hey_jarvis", "alexa", "hey_mycroft", "timer", etc.
  # Or path to custom .onnx model, e.g. "./models/my_wakeword.onnx"
  model: "./models/hey_Poon-dyk_acc_0.84_recall_0.69_fp_4.5.onnx"
  verifier_threshold: 0.70  # Min verifier score to fire the assistant
  record_detections: true   # Save 3s pre-detection WAV to data/wake_captures/raw/ for FP collection
  verifier_model: "./models/verifier.pkl"  # null to disable; train with scripts/train_verifier.py
  oww_threshold: 0.1        # Min raw OWW score to run verifier (gate to avoid unnecessary inference)

# --- Speech-to-Text ---
stt:
  model: "base.en"          # tiny.en | base.en | small.en  (tiny.en ~1s on RPi5 vs ~2s for base.en)
  device: "cpu"
  compute_type: "int8"
  beam_size: 1
  language: "en"
  vad_filter: true
  silence_timeout_s: 2   # Seconds of silence before STT finalizes
  # null = auto-detect USB mic via 'arecord -l' (survives device index changes on reboot).
  # Set to an ALSA device string like "plughw:1,0" to force a specific device.
  alsa_device: null

# --- LLM ---
llm:
  preferred_backend: "remote"                    # Default backend: "remote" or "local". Falls back to "local" if preferred is offline.
  remote_base_url: "http://192.168.1.74:11434"  # GPU PC — Ollama
  remote_model: "gemma4:e4b"                     # Model to activate on GPU if nothing is running
  local_base_url: "http://localhost:8080"        # RPi — llama.cpp server (always-available fallback)
  # llama.cpp server startup (recommended flags for RPi5):
  #   llama-server -m /path/to/model.gguf --port 8080 --ctx-size 2048 -np 1 -t 4 --reasoning-budget 0 \
  #     --cache-type-k q8_0 --cache-type-v q8_0
  #
  # --cache-type-k/v q8_0: quantise KV cache to 8-bit (halves VRAM/RAM usage, no quality loss)
  # cache_prompt=true is sent per-request (see backends.py) — the KV cache is reused for
  # identical prompt prefixes so only new conversation turns need prefill after the first query.

  # Fast local model — default for everyday queries
  local:
    model: "gemma4-e2b-q4km"   # Informational; echoed in backend.name (llama.cpp ignores it)
    temperature: 0.4
    num_ctx: 2048              # Set at llama-server startup (--ctx-size), kept for reference
    num_predict: 256           # Max tokens per response — leaves room for tool call JSON + brief reply
    # num_thread: set at llama-server startup (-t flag), not passed via API
    think: false
    # System prompt is loaded from memory/PERSONA.md (human-editable, git-tracked)

  cloud:
    claude:
      model: "claude-haiku-4-5-20251001"  # see https://console.anthropic.com/models
      max_tokens: 1024
    gemini:
      model: "gemini-3.1-flash-lite-preview" # gemini-2.5-flash; gemini-2.5-flash-lite;  see https://ai.google.dev/gemini/docs/models
      max_tokens: 1024

  router:
    # Patterns that trigger model selection
    triggers:
      remote:
        - "use GPU"
        - "use remote"
        - "switch to GPU"
        - "switch to remote"
      local:
        - "use local model"
        - "switch to local"
        - "go offline"
        - "switch to raspberry pi"
        - "use raspberry pi"
      claude:
        - "use claude"
        - "ask claude"
        - "switch to claude"
        - "use anthropic"
        - "ask anthropic"
        - "switch to anthropic"
        - "switch to cloud"
      gemini:
        - "use gemini"
        - "ask gemini"
        - "switch to gemini"
      auto:
        - "go back to automatic"
        - "use automatic"
        - "use ollama"

# --- Tools ---
tools:
  weather:
    provider: "open-meteo"    # Free, no API key needed
  web_search:
    provider: "duckduckgo"    # Free, no API key needed
  todoist:
    # Set TODOIST_API_TOKEN and TODOIST_PROJECT_ID in .env
    # API token: todoist.com → Settings → Integrations → Developer → API token
    # Project ID: open the Shopping project in Todoist web, copy the number from the URL
  vacuum:
    ip: "192.168.1.12"   # Valetudo robot on LAN

# --- TTS ---
tts:
  voice: "./voices/en_US-hfc_male-medium.onnx"
  # Streaming: synthesize per-sentence and pipe to aplay
  aplay_device: "plughw:2,0"  # USB audio device
  volume: 70                  # TTS output volume (0-100); sets ALSA mixer at startup
  sentence_delimiters: ".!?;"
  sounds_dir: "./sounds"      # Pre-recorded WAV sounds; run scripts/generate_sounds.py --all to create

# --- Media Player (internet radio via mpv + Radio Browser API) ---
player:
  ipc_socket: "/tmp/va-mpv.sock"
  radio_browser_base: "https://de1.api.radio-browser.info"
  search_limit: 5
  request_timeout_s: 5
  default_volume: 65         # Music-only starting volume (0-100)

# --- Session ---
session:
  inactivity_timeout_s: 600  # 15 minutes — longer for cooking sessions
  auto_summarize: true       # Summarize conversation on session end

# --- Display (UI mode only) ---
display:
  theme: retro               # "retro" = pixel/CRT style | "default" = dark minimal
  dim_after_idle_s: 60       # Seconds of idle before dimming backlight to minimum (0 = disabled)
  dim_min_level: 1           # Backlight value to set when dimming (0 = off, 1 = faintest visible)
  recipe_timeout_s: 300      # Seconds before recipe screen auto-dismisses to idle (0 = never)

# --- Resource Monitoring ---
monitor:
  enabled: true
  log_interval_s: 30         # Log CPU/RAM/temp every N seconds
  thresholds:
    ram_percent: 85           # Warn if RAM usage exceeds this %
    cpu_percent: 95           # Warn if CPU exceeds this %
    temp_celsius: 80          # Warn if CPU temp exceeds this °C

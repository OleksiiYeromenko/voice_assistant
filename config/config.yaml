# Voice Assistant Configuration
# Copy to config.yaml and edit for your setup

# --- Wake Word ---
wake_word:
  # Pre-trained models: "hey_jarvis", "alexa", "hey_mycroft", "timer", etc.
  # Or path to custom .onnx model
  model: "hey_jarvis"
  threshold: 0.7           # Detection confidence (0.0-1.0)

# --- Speech-to-Text ---
stt:
  model: "base.en"          # tiny.en | base.en | small.en
  device: "cpu"
  compute_type: "int8"
  beam_size: 1
  language: "en"
  vad_filter: true
  silence_timeout_s: 1.5   # Seconds of silence before STT finalizes
  # null = auto-detect USB mic via 'arecord -l' (survives device index changes on reboot).
  # Set to an ALSA device string like "plughw:1,0" to force a specific device.
  alsa_device: null

# --- LLM ---
llm:
  base_url: "http://localhost:11434"   # Shared Ollama URL for all local models
  # Optional Ollama server-side env vars for Raspberry Pi performance:
  #   OLLAMA_KEEP_ALIVE=-1           # Keep model in RAM forever (set in systemd service)
  #   OLLAMA_FLASH_ATTENTION=1       # Lower memory as context grows
  #   OLLAMA_KV_CACHE_TYPE=q8_0      # Half the KV cache memory vs f16

  # Fast local model — default for everyday queries
  local:
    model: "qwen2.5:3b"
    temperature: 0.7
    num_ctx: 4096
    think: false
    system_prompt: |
      You are a helpful home voice assistant running on a Raspberry Pi.
      Keep responses concise and conversational — they will be spoken aloud.
      Prefer 1-3 sentence answers unless the user asks for detail.

      Tool usage rules:
      - get_time: ALWAYS use when user asks about current time, date, or time in another city.
      - get_weather: when user asks about weather or temperature outside.
      - web_search: Use for anything you cannot answer with confident, up-to-date facts.
        This includes: current prices, live scores, today's news, recent events, stock/crypto
        prices, "what happened", "latest", "current", "today". When in doubt, search.
        Do NOT use for: poems, stories, jokes, creative writing, explanations of concepts,
        math, or general knowledge you already know well.
      - remember: when user says "remember this" or shares personal info to save.
      - add_to_shopping_list: when user wants to add items to buy.
      If you lack current data to answer a question, ALWAYS use web_search rather than
      telling the user to "check a website" or "look it up themselves".
      After using web_search, give a direct concise answer from the results.
      NEVER list website names or tell the user to visit websites.
      If the search results don't contain exact data, say what you found briefly.

  cloud:
    claude:
      model: "claude-sonnet-4-5-20250929"
      max_tokens: 1024
    gemini:
      model: "gemini-2.0-flash"
      max_tokens: 1024

  router:
    # Patterns that trigger model selection
    triggers:
      claude:
        - "use claude"
        - "ask claude"
        - "switch to claude"
      gemini:
        - "use gemini"
        - "ask gemini"
        - "switch to gemini"
      local:
        - "use local"
        - "go offline"
        - "use ollama"
        - "go back to automatic"

# --- Tools ---
tools:
  weather:
    provider: "open-meteo"    # Free, no API key needed
  web_search:
    provider: "duckduckgo"    # Free, no API key needed
  google_keep:
    enabled: false            # Requires auth setup — see docs/google_keep.md

# --- TTS ---
tts:
  voice: "./voices/en_US-hfc_male-medium.onnx"
  # Streaming: synthesize per-sentence and pipe to aplay
  aplay_device: "plughw:0,0"  # USB audio device
  sentence_delimiters: ".!?;"

# --- Session ---
session:
  inactivity_timeout_s: 300  # 5 minutes — session ends after this gap
  auto_summarize: true       # Summarize conversation on session end

# --- Resource Monitoring ---
monitor:
  enabled: true
  log_interval_s: 30         # Log CPU/RAM/temp every N seconds
  thresholds:
    ram_percent: 85           # Warn if RAM usage exceeds this %
    cpu_percent: 95           # Warn if CPU exceeds this %
    temp_celsius: 80          # Warn if CPU temp exceeds this °C